server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:cindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=CIN_SYSTEM_JWT_SECRET_KEY_2024_VERY_SECURE_256_BITS_MIN
app.jwt.expiration=86400000

# 2FA
app.2fa.issuer=CIN-System

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.cin=DEBUG